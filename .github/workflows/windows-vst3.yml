name: Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DPRISMVST_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "PRISMVST.vst3" -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "PRISMVST.vst3 was not produced" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName dist\PRISMVST.vst3
      - name: Verify staged VST3 bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\PRISMVST.vst3\Contents\x86_64-win\PRISMVST.vst3")) {
            throw "VST3 bundle wrapper is incomplete"
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PRISMVST-Windows-VST3
          path: dist
          if-no-files-found: error
