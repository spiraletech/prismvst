name: Windows VST3

on:
  push:
    branches: [ main, roots-v2-graph-dsp-rebuild, roots-v2-1hz-spectral-solo-fix, roots-v2-boundary-pair-solo, roots-v2-horizontal-handles-root-gain, roots-v2-root-controls-selector-fix ]
  pull_request:
    branches: [ main, alpha-1.2.0-resonant-wax, roots-v2-experimental, roots-v2-graph-dsp-rebuild ]
  workflow_dispatch:

concurrency:
  group: prismvst-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DPRISMVST_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "PRISM ROOTS PROTO 001.vst3" -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "PRISM ROOTS PROTO 001 VST3 was not produced" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName "dist\PRISM ROOTS PROTO 001.vst3"
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-ROOTS-PROTO-001-Windows-VST3
          path: "dist/PRISM ROOTS PROTO 001.vst3"
          if-no-files-found: error
