name: Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: prismvst-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DPRISMVST_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "PRISM Alpha 001 VST3 was not produced" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName "dist\PRISM Alpha 001.vst3"
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Alpha-001-v0.3.3-Windows-VST3
          path: "dist/PRISM Alpha 001.vst3"
          if-no-files-found: error
